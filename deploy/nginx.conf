# /etc/nginx/sites-available/siakad  (symlinked into sites-enabled)
#
# Replace siakad.example with your domain (deploy/README.md step 6), then:
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d siakad.example --redirect
# certbot adds the HTTPS server (port 443) and the redirect from HTTP itself.

server {
    listen 80;
    listen [::]:80;
    server_name siakad.example;

    root /var/www/siakad/current/public;
    index index.php;
    charset utf-8;

    # Uploads allow 10 MB (PHP: upload_max_filesize 12M, post_max_size 16M). To upload a backup .zip for
    # restoring from Superadmin → Data & cadangan, raise this and both PHP sizes to the backup's size.
    client_max_body_size 16M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Built CSS/JS have a hash in their name: cache them for a year.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        # The real path, so a new release is picked up when the "current" link changes.
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 75s;
        internal;
    }

    # Anything else ending in .php, and dotfiles (.env, .git), is refused.
    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known).* { deny all; }
}
