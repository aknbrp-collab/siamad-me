# /etc/supervisor/conf.d/siakad-queue.conf
#   sudo supervisorctl reread && sudo supervisorctl update && sudo supervisorctl start siakad-queue
#
# A permanent queue worker: calls to the website CMS and their retries (docs/OPERATIONS.md §2). Without it
# the scheduler still starts a worker every minute; with it, queued work starts at once.
# deploy.sh restarts it after each release (php artisan queue:restart).

[program:siakad-queue]
process_name=%(program_name)s
command=php /var/www/siakad/current/artisan queue:work --sleep=3 --tries=5 --max-time=3600
directory=/var/www/siakad/current
user=www-data
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
; Lets a running CMS call finish before a restart.
stopwaitsecs=90
redirect_stderr=true
stdout_logfile=/var/www/siakad/shared/storage/logs/queue.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
